<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOTAM Kaart – Nederlandse Luchtruimgebieden</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="lib/leaflet/leaflet.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Top toolbar with layer toggle buttons -->
  <div id="toolbar">
    <span id="toolbar-title">✈ NOTAM Kaart</span>
    <div id="layer-buttons">
      <button id="btn-prohibited" class="layer-btn active" data-layer="prohibited"
              title="Verboden gebieden (P)">
        <span class="btn-icon">🚫</span> Prohibited
      </button>
      <button id="btn-ctr" class="layer-btn active" data-layer="ctr"
              title="Plaatselijk luchtverkeersleidingsgebied (CTR)">
        <span class="btn-icon">🔵</span> CTR
      </button>
      <button id="btn-restricted" class="layer-btn active" data-layer="restricted"
              title="Beperkt luchtruim (R)">
        <span class="btn-icon">⚠️</span> Restricted
      </button>
      <button id="btn-tsa" class="layer-btn active" data-layer="tsa"
              title="Tijdelijk Gesegregeerd Luchtruim (TSA)">
        <span class="btn-icon">🟡</span> TSA
      </button>
    </div>
    <div id="status-bar">
      <span id="status-text">Kaart laden…</span>
    </div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Legend -->
  <div id="legend">
    <h4>Legenda</h4>
    <div class="legend-item">
      <span class="legend-swatch" style="background:rgba(220,38,38,0.35);border-color:#dc2626;"></span>
      Prohibited (P)
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:rgba(37,99,235,0.25);border-color:#2563eb;"></span>
      CTR
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:rgba(234,179,8,0.3);border-color:#ca8a04;"></span>
      Restricted (R)
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:rgba(168,85,247,0.25);border-color:#9333ea;"></span>
      TSA
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="lib/leaflet/leaflet.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
